<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoro Ai</title>
    <link rel="stylesheet" href="zoro.css" />
    <link rel="shortcut icon" href="default.img" type="image/x-icon">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"/>
  </head>

  <body>
    <!-- Navbar Start-->
    <nav id="navbar">
      <a href="#">
        <img src="img/zoroai-logo.png" alt="" />
      </a>

      <h3>Zoro.ai</h3>

      <a href="#"> Product </a>
      <a href="#"> Soltuions </a>
      <a href="#"> Resources </a>
      <a href="#"> Pricing </a>

      <button>Sign In</button>
    </nav>

    <!-- Navbar End -->

    <!-- Data Card -->

    <div id="card">
      <img src="img/zoro.img.png" alt="" id="zoro-img" />

      <div id="usage-container">
        <h4 id="fc-usg">Funnel Conversion</h4>

        <h5 id="cn-usg">Conversion <span>Added To Cart</span></h5>

        <span id="cn-usg-container">
          <span>82.45%</span>
        </span>

        <span id="atc-usg-container">
          <span id="atc-usg1">
            <h4>23.4%</h4>
          </span>

          <span id="atc-usg2">
            <h4>76.6%</h4>
          </span>
        </span>
      </div>

      <div id="clickbtn">
        <label class="btn">
          <input type="checkbox" />
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
          <label id="fav-tagline">This is silk! <br />Time to test it</label>
        </label>
      </div>

      <div id="zoro-tagline">
        <span id="wrd1">Cut</span><br />
        <span id="wrd2">EveryThing</span>
      </div>

      <p id="adline">Zoro The Striker Made by Sarhan In 2026</p>
    </div>

    <!-- Card End -->

    <!-- main title div -->

    <div id="main-title">
      <span id="mn1">Never</span>
      <span id="mn2">Back</span>
      <span id="mn3">Down</span>
      <span id="mn4">Again. </span>
    </div>

    <!-- main title div end -->

    <button id="tff-btn">Try For Free</button>

    <button id="bad-btn">Book A Demo</button>
  </body>
</html>
